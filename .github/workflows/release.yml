name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

  release:
    name: Build and publish
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the .deb and the AppImage
        run: npm run bundle
        env:
          NO_STRIP: "true"

      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from the changelog
        run: |
          node -e '
          const fs = require("fs");
          const { version } = require("./package.json");
          const heading = "## [" + version + "]";
          const section = [];
          let inside = false;
          for (const line of fs.readFileSync("CHANGELOG.md", "utf8").split("\n")) {
            if (line.startsWith(heading)) { inside = true; continue; }
            if (inside && line.startsWith("## [")) break;
            if (inside) section.push(line);
          }
          const body = section.join("\n").trim() || "See CHANGELOG.md.";
          const notes = [
            "Shelfs " + version + " — a local-first PDF and EPUB library on a 3D bookcase.",
            "",
            "### Install",
            "",
            "```bash",
            "sha256sum -c SHA256SUMS.txt",
            "sudo apt install ./Shelfs_" + version + "_amd64.deb",
            "chmod +x Shelfs_" + version + "_amd64.AppImage   # or run this instead",
            "```",
            "",
            body,
            "",
          ].join("\n");
          fs.writeFileSync("release-notes.md", notes);
          console.log(notes);
          '

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Shelfs ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS.txt
