name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features dev-tools -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all --features dev-tools
      - name: Bindings are up to date
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --features dev-tools --bin export-bindings
          git diff --exit-code ui/src/bindings.ts
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      # cargo-audit has no --manifest-path; both tools pick up the crate (and
      # src-tauri/deny.toml) from the working directory instead.
      - name: Audit advisories
        working-directory: src-tauri
        run: cargo audit
      - name: Licence and source policy
        working-directory: src-tauri
        run: cargo deny check

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build:web

  package:
    name: Bundles (.deb, AppImage)
    runs-on: ubuntu-24.04
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build bundles
        run: npm run bundle
        env:
          # AppImage tooling downloads nothing at build time beyond its runtime.
          NO_STRIP: "true"
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: bookshelf-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: bookshelf-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  gui-smoke:
    name: Headless GUI smoke
    runs-on: ubuntu-24.04
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev build-essential \
            xvfb xdotool imagemagick libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build the app
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Generate fixtures and screenshot the shelf
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --features dev-tools --bin make-fixtures -- /tmp/books 6 4
          scripts/gui-smoke.sh /tmp/shelf.png /tmp/books
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: /tmp/shelf.png
