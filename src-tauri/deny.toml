# cargo-deny policy: permissive licences only, crates.io only, no wildcard
# dependencies. Run with `cargo deny --manifest-path src-tauri/Cargo.toml check`.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "warn"
# Unmaintained-only advisories for crates we do not use directly and cannot
# replace yet: `paste` and `proc-macro-error` come from macro crates in the
# Tauri/GTK build stack, and `zbus_names`, `zvariant`, `zvariant_derive` are the
# D-Bus bindings behind tauri-plugin-single-instance's `zbus` 5 (zbus 6 absorbs
# them, so they disappear once the plugin upgrades). None is a vulnerability.
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error, unmaintained
  "RUSTSEC-2024-0436", # paste, unmaintained
  "RUSTSEC-2026-0370", # zbus_names, unmaintained
  "RUSTSEC-2026-0371", # zvariant, unmaintained
  "RUSTSEC-2026-0372", # zvariant_derive, unmaintained
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
]

# The app itself is GPL-3.0-or-later; the allow list above still covers only
# permissive licences for everything it links against.
[[licenses.exceptions]]
crate = "bookshelf"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
  # Rendering/parsing libraries with copyleft or unclear licensing are not used.
  { name = "pdfium-render" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
