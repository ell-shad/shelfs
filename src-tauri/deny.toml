# cargo-deny policy: permissive licences only, crates.io only, no wildcard
# dependencies. Run with `cargo deny --manifest-path src-tauri/Cargo.toml check`.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
  # Rendering/parsing libraries with copyleft or unclear licensing are not used.
  { name = "pdfium-render" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
